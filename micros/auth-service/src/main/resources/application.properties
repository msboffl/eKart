spring.application.name=${APPLICATION_NAME: auth-service}
server.port=${SERVER_PORT: 4001}

# ============= Database ==================
spring.datasource.url=jdbc:postgresql://localhost:5001/ekart_users
spring.datasource.username=ekart
spring.datasource.password=ekart
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============= Health Check ================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


